<!doctype html>
<html lang="ar" dir="auto" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدار - غير متصل / Madar - Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --surface: #0e1219;
      --fg: #ecf0f4;
      --muted: #919eaf;
      --accent: #10b981;
      --accent-fg: #030c09;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 28rem;
      width: 90%;
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--fg);
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>أنت غير متصل بالإنترنت / You're offline</h1>
    <p>
      تعذر الاتصال بالخادم. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.<br>
      Unable to connect to the server. Please check your internet connection and try again.
    </p>
    <button onclick="window.location.reload()">إعادة المحاولة / Retry</button>
  </div>
</body>
</html>
